  [params.homeInfoParams]
    Title = "Jeremy Adams - Casañas"
    Content = """
## Tech Translator

Senior Developer Advocate at **Neo4j**. Formerly **Dagger · GitHub · Twistlock · Puppet · US Army**.

I work at the intersection of data, developer tooling, and community — translating complex technology into real-world impact. Passionate about helping practitioners adopt graph databases, build thriving developer ecosystems, and tackle the hard, relationship-centric problems that matter.

Available to speak at conferences, meetups, workshops, and podcasts. [See my talks →](/speaking/)
"""

